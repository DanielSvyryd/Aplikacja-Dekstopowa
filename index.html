
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Student Progress Tracker Prototype</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }


body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: rgba(30, 30, 30, 0.95);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            border: 1px solid #444;
        }

        #search-container {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #444;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 18px;
            outline: none;
            padding-left: 10px;
        }

        #response-container {
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
            display: none; /* Ховаємо, поки немає відповіді */
        }

        .loader {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            display: none;
        }
      </style>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>



      

      <div id="search-container">
        <span>🔍</span>
        <input type="text" id="ai-input" placeholder="Ask me something..." autofocus>
    </div>

    <div id="response-container">
        <div id="ai-text"></div>
        <div class="loader" id="loader">ШІ думає...</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const input = document.getElementById('ai-input');
        const responseContainer = document.getElementById('response-container');
        const aiText = document.getElementById('ai-text');
        const loader = document.getElementById('loader');

        // Слухаємо натискання клавіш
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                const query = input.value;
                
                // Візуальна підготовка
                responseContainer.style.display = 'block';
                aiText.innerText = '';
                loader.style.display = 'block';
                
                // Відправляємо запит у головний процес (main.cjs)
                ipcRenderer.send('ask-ai', query);
            }

            if (e.key === 'Escape') {
                ipcRenderer.send('hide-window'); // Закриваємо вікно на Esc
            }
        });

        // Отримуємо відповідь від ШІ
        ipcRenderer.on('ai-response', (event, response) => {
            loader.style.display = 'none';
            aiText.innerText = response;
        });
    </script>
    </body>
  </html>
